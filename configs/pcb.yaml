# PCB 缺陷检测数据集配置
# 数据来源：RobotHuman/PCB_defect (即 PKU-Market-PCB, Huang et al. 2019)
# HuggingFace 公开数据集，下载无需登录。

dataset:
  repo_id: "RobotHuman/PCB_defect"
  name: "pcb_defect"

  # 类别表：顺序固定，索引即为 YOLO 的 class id。
  # 必须以 XML 里的 <name> 为准（小写 + 下划线），不要从文件夹名推断。
  classes:
    - missing_hole
    - mouse_bite
    - open_circuit
    - short
    - spur
    - spurious_copper

  # 标注文件名后缀：X.jpg <-> X_annotation.xml
  annotation_suffix: "_annotation.xml"

  # 该镜像的图片总数，用于判断下载是否完整（不足则自动重试续传）
  expected_images: 693

  # ---------------------------------------------------------------------
  # ⚠️ 防泄漏：按 PCB 母板分组划分（务必保留）
  #
  # 实测发现：本数据集只有 10 块 PCB 母板，每块母板用 Photoshop 合成 6 类
  # 缺陷各若干张。同母板的图在【非缺陷区域逐像素完全相同】
  # （实测 0.00 灰阶差、0.0% 差异像素）。
  #
  # 因此若按图片随机划分（哪怕按类别分层），同一块母板会同时出现在 train
  # 和 test —— 模型会靠"认板子"而不是"认缺陷"拿到虚高的分数。
  #
  # 划必须以 block 为单位：整块母板只能进一个 split。
  # ---------------------------------------------------------------------
  template_blocks:
    - [1, 20]
    - [21, 40]
    - [41, 50]
    - [51, 60]
    - [61, 70]
    - [71, 80]
    - [81, 90]
    - [91, 95]
    - [96, 105]
    - [106, 116]

  # block 序号（从 1 开始）分配到哪个 split。每个 block 都含全部 6 类，
  # 所以各 split 的类别分布天然均衡。
  block_split:
    train: [1, 2, 3, 4, 5, 6]
    val:   [7, 8]
    test:  [9, 10]

  # 仅在未启用 block 划分时才使用的比例划分（保留作回退）
  split:
    train: 0.70
    val: 0.15
    test: 0.15

  # 固定种子，保证划分可复现
  seed: 42

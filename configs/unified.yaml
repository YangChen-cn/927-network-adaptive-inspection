# ============================================================================
# 统一数据集配置 —— PKU-Market-PCB  +  PCB-Defect 2025
# ============================================================================
#
# 【类别统一结论：7 类，不合并 missing_hole 与 missing_pad】
#
# 两类缺陷经核实【语义不同】，因此保持为两个独立类别：
#
#   missing_hole (PKU)      : 该钻孔的地方没有孔。实测图中其他焊盘都有可见的
#                             金属化钻孔，出问题那个焊盘整个是平的、缺孔。
#   missing_pad  (PCB2025)  : 铜焊盘本身缺失/破损。实测图中走线末端的铜箔
#                             环状焊盘不完整。
#
#   孔(hole) ≠ 焊盘(pad)，是 PCB 制造里两种不同的特征，不能强行合并。
#   依据：① PCB-Defect 2025 数据集自述明确写的是 "missing pad"；
#         ② 已切出两类缺陷的实际图像做视觉比对确认。
#
# 其余 5 类【命名完全相同】（两个数据集都用下划线风格），直接合并：
#   mouse_bite / open_circuit / short / spur / spurious_copper
#
# 注意：两个数据集的原始 class id 都不能直接沿用，必须经下面的 mapping
# 重新映射，否则会出现「同一 id 指向不同含义」的错误。
# ----------------------------------------------------------------------------

unified:
  name: unified
  # 统一后的类别表（class_id 即索引）
  classes:
    - missing_hole        # 0  —— 仅 PKU 有
    - missing_pad         # 1  —— 仅 PCB-Defect 2025 有
    - mouse_bite          # 2  —— 两者都有
    - open_circuit        # 3  —— 两者都有
    - short               # 4  —— 两者都有
    - spur                # 5  —— 两者都有
    - spurious_copper     # 6  —— 两者都有

# ---------------------------------------------------------------------------
# 数据集 A：PKU-Market-PCB
# ---------------------------------------------------------------------------
pku:
  source: "RobotHuman/PCB_defect"     # HuggingFace，MX 693 张
  raw_dir: "data/raw/pcb_defect"
  annotation: "voc_xml"               # Pascal VOC XML
  image_glob: "*/*.jpg"
  annotation_suffix: "_annotation.xml"
  # 原始类别（XML <name>） -> 统一 class id
  category_map:
    missing_hole: 0
    mouse_bite: 2
    open_circuit: 3
    short: 4
    spur: 5
    spurious_copper: 6

  # ---- 防泄漏：按母板分组划分 ----
  # 实测发现：PKU 只有 10 块 PCB 母板，每块母板合成 6 类缺陷各若干张。
  # 同母板的图在【非缺陷区域逐像素完全相同】（实测差异 0.00 灰阶、0.0% 像素）。
  # 因此若按图片随机划分，同一块母板会同时出现在 train 和 test —— 严重泄漏。
  # 下面的 block 就是母板分组，按序号区间定义；划分以 block 为单位。
  template_blocks:
    - [1, 20]
    - [21, 40]
    - [41, 50]
    - [51, 60]
    - [61, 70]
    - [71, 80]
    - [81, 90]
    - [91, 95]
    - [96, 105]
    - [106, 116]
  # block 索引（从 1 开始）分配到哪个 split
  block_split:
    train: [1, 2, 3, 4, 5, 6]
    val:   [7, 8]
    test:  [9, 10]

# ---------------------------------------------------------------------------
# 数据集 B：PCB-Defect 2025 (Mendeley)
# ---------------------------------------------------------------------------
pcb2025:
  source: "10.17632/vdj74sngvn.1"
  raw_dir: "data/raw/pcb_defect_2025"
  annotation: "coco_json"             # COCO JSON
  coco_json: "PCB_Defect/annotation/_annotations.coco.json"
  images_dir: "PCB_Defect/images"
  license: "CC BY 4.0"
  download_url: "https://data.mendeley.com/public-files/datasets/vdj74sngvn/files/9a62af5d-f3ea-4b3d-a99b-e48115d51c2f/file_downloaded"
  sha256: "a5fb17e7009f96ffdb833cd9309b36da775545c8cc36a6dca3a8e9b4fbcb5f2a"
  # 原始类别（COCO categories[].name） -> 统一 class id
  # 注意：原始 COCO 里 id=0 是 'detecting-pcb-defects'（supercategory 占位，0 个标注），
  #       真正的类别是 id=1..6，不能直接当 class id 用。
  category_map:
    missing_pad: 1
    mouse_bite: 2
    open_circuit: 3
    short: 4
    spur: 5
    spurious_copper: 6
  # 实测：230 张图尺寸全部不同（230 个唯一尺寸），是各自独立的板子，
  # 不存在同源/派生图片，因此按图片随机划分即可，无泄漏风险。
  split:
    train: 0.70
    val: 0.15
    test: 0.15

split_seed: 42
